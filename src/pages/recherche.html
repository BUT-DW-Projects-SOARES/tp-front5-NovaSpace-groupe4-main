<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Recherche sur NovaSpace : trouve une planète ou une page du site." />
    <title>Recherche - NovaSpace</title>
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="icon" type="image/svg+xml" href="/images/earth.svg" />
  </head>
  <body class="bg-space text-ink antialiased">
    <a href="#contenu" class="lien-evitement">Aller au contenu principal</a>
    <site-header></site-header>

    <main id="contenu" tabindex="-1" class="mx-auto max-w-6xl px-6 pb-16 pt-12 sm:px-10 sm:pb-24 sm:pt-20">
      <section aria-labelledby="recherche-titre">
        <p class="mb-6 text-sm font-semibold uppercase tracking-widest text-muted">NovaSpace · Recherche</p>
        <h1 id="recherche-titre" class="text-4xl font-semibold leading-tight tracking-tight sm:text-5xl">Rechercher sur le site<span class="text-earth">.</span></h1>
        <p class="mt-6 max-w-2xl text-lg leading-relaxed text-muted">Saisis un nom de planète ou un mot-clés dans la barre de recherche du menu pour afficher les résultats ici.</p>
      </section>

      <section class="mt-12" aria-labelledby="resultats-titre">
        <h2 id="resultats-titre" class="text-2xl font-semibold tracking-tight sm:text-3xl">
          <span id="recherche-compteur">Recherche</span>
        </h2>
        <div id="recherche-resultats" class="mt-6 grid gap-4 md:grid-cols-2" aria-live="polite"></div>
      </section>
    </main>

    <site-footer></site-footer>

    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/search.js"></script>
  </body>
</html>
